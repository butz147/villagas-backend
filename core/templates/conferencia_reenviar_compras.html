{% extends "base.html" %}
{% block content %}

<div class="topbar">
    <h1><i class="bi bi-bag-check"></i> Reenviar Compras</h1>
    <p>Selecione o período para reenviar as compras para a planilha</p>
</div>

{% if mensagem %}
<div class="alert alert-success">
    <i class="bi bi-check-circle-fill"></i> {{ mensagem }}
</div>
{% endif %}
{% if erro %}
<div class="alert alert-danger">
    <i class="bi bi-exclamation-triangle-fill"></i> {{ erro }}
</div>
{% endif %}

<div class="card">
    <div class="section-title" style="margin-bottom:16px;">Período</div>
    <form method="post">
        {% csrf_token %}
        <div class="form-grid">
            <div class="form-group">
                <label>De:</label>
                <input type="date" name="data_ini" required>
            </div>
            <div class="form-group">
                <label>Até:</label>
                <input type="date" name="data_fim" required>
            </div>
        </div>
        <div style="margin-top:16px;">
            <button type="submit" class="btn btn-success">
                <i class="bi bi-send"></i> Enviar para Planilha
            </button>
        </div>
    </form>
</div>

{% endblock %}
